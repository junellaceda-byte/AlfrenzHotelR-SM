<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="cubeBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdfbf9" />
            <stop offset="100%" stop-color="#f3ede6" />
        </linearGradient>
        <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8a5a47" />
            <stop offset="100%" stop-color="#6A4435" />
        </linearGradient>
        <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5a382a" />
            <stop offset="100%" stop-color="#442a1f" />
        </linearGradient>
        <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#734939" />
            <stop offset="100%" stop-color="#543324" />
        </linearGradient>
    </defs>
    <!-- Cube Background Container with rounded border -->
    <rect width="100" height="100" rx="16" fill="url(#cubeBg)" stroke="#e4dcd3" stroke-width="2"/>
    <!-- Isometric Cube / Amenity Box -->
    <g transform="translate(0, 4)">
        <!-- Top Face -->
        <polygon points="50,23 74,36 50,49 26,36" fill="url(#cubeTop)" stroke="#442a1f" stroke-width="0.8" stroke-linejoin="round"/>
        <!-- Left Face -->
        <polygon points="26,36 50,49 50,77 26,64" fill="url(#cubeLeft)" stroke="#442a1f" stroke-width="0.8" stroke-linejoin="round"/>
        <!-- Right Face -->
        <polygon points="50,49 74,36 74,64 50,77" fill="url(#cubeRight)" stroke="#442a1f" stroke-width="0.8" stroke-linejoin="round"/>
        <!-- Sparkle accent -->
        <path d="M72 20 Q75 25 80 25 Q75 25 72 30 Q72 25 67 25 Q72 25 72 20 Z" fill="#d4af37" opacity="0.9"/>
    </g>
</svg>
